# ============================================================
# Booster T1 舞蹈动作重定向系统 — 默认配置文件
# ============================================================
# 每个模块的成员可在此文件中覆盖对应参数。
# 未列出的键将自动继承 common/config_loader.py 中的默认值。

# ----------------------------------------------------------
# 视频处理 (成员E)
# ----------------------------------------------------------
video:
  input_path: "data/input_video.mp4"
  fps: 30
  max_frames: 300

# ----------------------------------------------------------
# 姿态提取 (成员B)
# ----------------------------------------------------------
pose:
  model_name: "rtmpose-m"
  device: "cpu"                    # cpu / cuda:0
  confidence_threshold: 0.5

# ----------------------------------------------------------
# 数据清洗 (成员I)
# ----------------------------------------------------------
cleaner:
  interpolation_method: "linear"   # linear / cubic / spline
  smooth_window: 5
  outlier_threshold: 3.0

# ----------------------------------------------------------
# 动作重定向 (成员D)
# ----------------------------------------------------------
retargeting:
  method: "ik"                     # ik / analytic / learned
  scale_factor: 1.0

# ----------------------------------------------------------
# MuJoCo 仿真 (成员F)
# ----------------------------------------------------------
simulation:
  model_path: "models/booster_t1.xml"
  render: true
  output_video: "outputs/result.mp4"
  duration: 10.0                  # 播放时长(秒)，0 表示全部

# ----------------------------------------------------------
# 日志与系统
# ----------------------------------------------------------
logging:
  level: "INFO"                    # DEBUG / INFO / WARNING / ERROR
  save_logs: true
