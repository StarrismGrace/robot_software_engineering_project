# ============================================================
# 动作重定向配置 — 成员D
# ============================================================
# 说明：
#   - 输入和输出使用相同的 23 个 Booster T1 标准关节名
#   - 本配置文件定义关节角度计算所需的父子关系和缩放参数

# 关节父子关系（用于计算角度）
# 格式：子关节: 父关节
parent_map:
  left_elbow: left_shoulder
  right_elbow: right_shoulder
  left_knee: left_hip
  right_knee: right_hip
  left_ankle: left_knee
  right_ankle: right_knee
  left_shoulder: chest
  right_shoulder: chest
  left_hip: root
  right_hip: root

# 角度缩放因子（限制动作幅度）
scale_factors:
  default: 0.8
  arm: 0.7
  leg: 0.8
  spine: 0.5

# 关节角度限位（弧度）
joint_limits:
  root: [-0.3, 0.3]
  waist: [-0.3, 0.3]
  chest: [-0.3, 0.3]
  neck: [-0.5, 0.5]
  head: [-0.5, 0.5]
  left_shoulder: [-2.5, 2.5]
  left_elbow: [0.0, 2.5]
  left_wrist: [-1.0, 1.0]
  right_shoulder: [-2.5, 2.5]
  right_elbow: [0.0, 2.5]
  right_wrist: [-1.0, 1.0]
  left_hip: [-1.5, 1.5]
  left_knee: [0.0, 2.5]
  left_ankle: [-1.0, 1.0]
  right_hip: [-1.5, 1.5]
  right_knee: [0.0, 2.5]
  right_ankle: [-1.0, 1.0]
  left_toe: [-0.5, 0.5]
  right_toe: [-0.5, 0.5]
  left_upper_arm: [-2.0, 2.0]
  right_upper_arm: [-2.0, 2.0]
  left_thigh: [-2.0, 2.0]
  right_thigh: [-2.0, 2.0]